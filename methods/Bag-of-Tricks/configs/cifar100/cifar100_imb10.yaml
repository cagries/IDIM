NAME: 'cifar100_imb10_twostage_pb'
OUTPUT_DIR: './output/cifar100/cifar100_imb100'
SHOW_STEP: 100
SAVE_STEP: 5
VALID_STEP: 1
INPUT_SIZE: (32, 32)
COLOR_SPACE: 'RGB'

DATASET:
  DATASET: 'IMBALANCECIFAR100'
  IMBALANCECIFAR:
    RATIO: 0.1

BACKBONE:
  TYPE: 'res32_cifar'

MODULE:
  TYPE: 'GAP'

CLASSIFIER:
  TYPE: 'FC'
  BIAS: True

LOSS:
  LOSS_TYPE: 'CrossEntropy'

